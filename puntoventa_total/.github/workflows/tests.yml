name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: puntoventa_total
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: puntoventa_test
          MYSQL_USER: puntoventa
          MYSQL_PASSWORD: puntoventa_secret
          MYSQL_ROOT_PASSWORD: root_secret
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot_secret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements/testing.txt ruff==0.4.4

      - name: Lint (ruff)
        run: ruff check src config scripts tests --select F821,F822,F823,E9

      - name: Pruebas unitarias
        env: &entorno_pruebas
          DJANGO_SETTINGS_MODULE: config.settings.testing
          DB_HOST: 127.0.0.1
          DB_USER: puntoventa
          DB_PASSWORD: puntoventa_secret
          DB_NAME: puntoventa_test
        run: pytest tests/unit --cov=src --cov-fail-under=0 --cov-report=xml --cov-report=json:reports/audit_unit_coverage.json && python scripts/qa_unit_gate.py

      - name: Pruebas funcionales y e2e
        env:
          DJANGO_SETTINGS_MODULE: config.settings.testing
          DB_HOST: 127.0.0.1
          DB_USER: puntoventa
          DB_PASSWORD: puntoventa_secret
          DB_NAME: puntoventa_test
        run: pytest -m "functional or e2e"

      - name: Subir cobertura
        uses: codecov/codecov-action@v4
        with:
          files: ./puntoventa_total/coverage.xml

