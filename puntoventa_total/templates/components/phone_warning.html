<dialog id="phone-warning" class="phone-warning border-0 rounded-3 shadow p-4" role="alertdialog"
        aria-labelledby="phone-warning-title" aria-describedby="phone-warning-message">
  <h5 id="phone-warning-title">Revisa el número de teléfono</h5>
  <p id="phone-warning-message" class="mb-3"></p>
  <form method="dialog" class="text-end">
    <button type="submit" class="btn btn-primary" autofocus>Corregir teléfono</button>
  </form>
</dialog>
