{% for producto in resultados %}
<a class="list-group-item list-group-item-action d-flex justify-content-between"
   href="#" data-agregar="{% url 'sales:agregar' venta_id producto.id %}">
  <span>{{ producto.nombre }} <small class="text-muted">({{ producto.codigo }})</small></span>
  <span class="fw-bold">S/ {{ producto.precio }}</span>
</a>
{% empty %}
<div class="list-group-item text-muted">Sin resultados</div>
{% endfor %}
