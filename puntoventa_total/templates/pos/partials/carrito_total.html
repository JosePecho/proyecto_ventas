<div class="card-footer" id="totales-carrito">
  <div class="d-flex justify-content-between"><span>Subtotal</span><span id="total-subtotal">S/ {{ venta.subtotal|floatformat:2 }}</span></div>
  <div class="d-flex justify-content-between"><span>Descuento</span><span id="total-descuento">S/ {{ venta.descuento|floatformat:2 }}</span></div>
  <div class="d-flex justify-content-between"><span>IGV (18%, incluido)</span><span id="total-igv">S/ {{ venta.igv|floatformat:2 }}</span></div>
  <hr>
  <div class="d-flex justify-content-between fw-bold fs-5"><span>TOTAL</span><span id="total-venta">S/ {{ venta.total|floatformat:2 }}</span></div>
  <a id="btn-cobrar" {% if venta.lineas %}href="{% url 'sales:pago' venta_id %}"{% else %}aria-disabled="true"{% endif %} class="btn btn-success w-100 mt-2{% if not venta.lineas %} disabled{% endif %}">
    <i class="bi bi-cash-coin"></i> Cobrar (F8)
  </a>
</div>
