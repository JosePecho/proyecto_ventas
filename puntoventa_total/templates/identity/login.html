{% extends 'base.html' %}
{% block title %}Iniciar sesion{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card shadow-sm mt-5">
      <div class="card-body">
        <h4 class="card-title text-center mb-3"><i class="bi bi-person-circle"></i> Iniciar sesion</h4>
        <form method="post" novalidate>
          {% csrf_token %}
          {% for campo in form %}
            <div class="mb-3">
              <label class="form-label">{{ campo.label }}</label>
              <input type="{{ campo.field.widget.input_type|default:'text' }}" name="{{ campo.name }}"
                     value="{{ campo.value|default:'' }}" class="form-control" {% if campo.errors %}is-invalid{% endif %}>
              {% for error in campo.errors %}<div class="invalid-feedback">{{ error }}</div>{% endfor %}
            </div>
          {% endfor %}
          <button class="btn btn-primary w-100" type="submit">Ingresar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
