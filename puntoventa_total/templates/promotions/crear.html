{% extends 'base.html' %}
{% block title %}Nueva promocion{% endblock %}
{% block content %}
<h4 class="mb-3">Nueva promocion</h4>
<form method="post" action="{% url 'promotions:crear' %}" class="card card-body col-md-8">
  {% csrf_token %}
  <input type="hidden" name="accion" value="crear">
  {% for campo in form %}
    <div class="mb-3"><label class="form-label">{{ campo.label }}</label>{{ campo }}
      {% for error in campo.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
    </div>
  {% endfor %}
  <button class="btn btn-primary" type="submit">Crear</button>
</form>
{% endblock %}
