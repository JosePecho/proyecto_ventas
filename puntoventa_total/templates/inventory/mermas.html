{% extends 'base.html' %}
{% block title %}Mermas{% endblock %}
{% block content %}
<h4 class="mb-3"><i class="bi bi-exclamation-octagon"></i> Registro de mermas</h4>
<form method="post" class="card card-body col-md-6 mb-4">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for campo in form %}
  <div class="mb-3"><label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>{{ campo }}{{ campo.errors }}</div>
  {% endfor %}
  <button class="btn btn-danger" type="submit"><i class="bi bi-trash"></i> Registrar merma</button>
</form>
{% endblock %}
