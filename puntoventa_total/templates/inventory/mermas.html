{% extends 'base.html' %}
{% block title %}Mermas{% endblock %}
{% block content %}
<h4 class="mb-3"><i class="bi bi-exclamation-octagon"></i> Registro de mermas</h4>
<form method="post" class="card card-body col-md-6 mb-4">
  {% csrf_token %}
  <div class="mb-3"><label class="form-label">Producto ID</label><input class="form-control" name="producto_id" required></div>
  <div class="mb-3"><label class="form-label">Cantidad</label><input type="number" min="1" class="form-control" name="cantidad" required></div>
  <div class="mb-3">
    <label class="form-label">Motivo</label>
    <select class="form-select" name="motivo">
      {% for valor, etiqueta in motivos %}<option value="{{ valor }}">{{ etiqueta }}</option>{% endfor %}
    </select>
  </div>
  <div class="mb-3"><label class="form-label">Observacion</label><input class="form-control" name="observacion"></div>
  <button class="btn btn-danger" type="submit"><i class="bi bi-trash"></i> Registrar merma</button>
</form>
{% endblock %}
