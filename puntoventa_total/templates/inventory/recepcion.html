{% extends 'base.html' %}
{% block title %}Recepcion de mercaderia{% endblock %}
{% block content %}
<h4 class="mb-3"><i class="bi bi-truck"></i> Recepcion de mercaderia</h4>
<form method="post" class="card card-body col-md-6">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for campo in form %}
    <div class="mb-3">
      <label class="form-label">{{ campo.label }}</label>
      {{ campo }}
      {% for error in campo.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
    </div>
  {% endfor %}
  <button class="btn btn-primary" type="submit"><i class="bi bi-check2"></i> Registrar ingreso</button>
</form>
{% endblock %}
