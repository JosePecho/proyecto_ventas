# El directorio TLS_CERT_DIR debe contener fullchain.pem y privkey.pem validos.
services:
  nginx:
    volumes:
      - ./deployment/nginx/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:?Defina TLS_CERT_DIR con el directorio de certificados}:/etc/nginx/tls:ro
    ports:
      - "443:443"
