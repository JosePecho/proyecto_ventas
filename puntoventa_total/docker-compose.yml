services:
  web:
    build: .
    env_file: .env
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --config deployment/gunicorn/gunicorn.conf.py"
    volumes:
      - ./media:/app/media
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: puntoventa
      MYSQL_USER: puntoventa
      MYSQL_PASSWORD: puntoventa_secret
      MYSQL_ROOT_PASSWORD: puntoventa_secret_root
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deployment/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    build: .
    env_file: .env
    command: celery -A config worker -l info --concurrency=2
    depends_on:
      - web
      - cache
    restart: unless-stopped

  beat:
    build: .
    env_file: .env
    command: celery -A config beat -l info
    depends_on:
      - cache
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - ./media:/app/media:ro
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  mysql_data:
  static_volume:

